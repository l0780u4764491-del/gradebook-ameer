name: Build GradeBook Android

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/ameer/gradebook
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "GradeBook"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.ameer.gradebook"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.ameer.gradebook"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              buildFeatures {
                  compose = true
              }

              packaging {
                  resources {
                      excludes += "/META-INF/{AL2.0,LGPL2.1}"
                  }
              }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.12.01"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.activity:activity-compose:1.10.0")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.7")

              debugImplementation("androidx.compose.ui:ui-tooling")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="سجل درجات الاجتماعيات"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#101827</item>
                  <item name="android:navigationBarColor">#101827</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/ameer/gradebook/MainActivity.kt <<'EOF'
          package com.ameer.gradebook

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  setContent {
                      GradeBookApp()
                  }
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun GradeBookApp() {

              MaterialTheme(
                  colorScheme = lightColorScheme(
                      primary = androidx.compose.ui.graphics.Color(0xFF172554),
                      secondary = androidx.compose.ui.graphics.Color(0xFFD4AF37),
                      background = androidx.compose.ui.graphics.Color(0xFFF5F7FA)
                  )
              ) {

                  Scaffold(
                      topBar = {
                          TopAppBar(
                              title = {
                                  Column {
                                      Text(
                                          text = "سجل درجات الاجتماعيات",
                                          fontSize = 20.sp,
                                          fontWeight = FontWeight.Bold
                                      )
                                      Text(
                                          text = "الأستاذ أمير محمد",
                                          fontSize = 13.sp
                                      )
                                  }
                              }
                          )
                      }
                  ) { padding ->

                      HomeScreen(
                          modifier = Modifier.padding(padding)
                      )
                  }
              }
          }

          @Composable
          fun HomeScreen(modifier: Modifier = Modifier) {

              val sections = listOf(
                  "الشعبة الأولى",
                  "الشعبة الثانية",
                  "الشعبة الثالثة",
                  "الشعبة الرابعة"
              )

              LazyColumn(
                  modifier = modifier
                      .fillMaxSize()
                      .padding(16.dp),
                  verticalArrangement = Arrangement.spacedBy(12.dp)
              ) {

                  item {
                      Card(
                          modifier = Modifier.fillMaxWidth()
                      ) {
                          Column(
                              modifier = Modifier.padding(20.dp)
                          ) {
                              Text(
                                  text = "مرحباً بك في سجل الدرجات",
                                  fontSize = 22.sp,
                                  fontWeight = FontWeight.Bold
                              )

                              Spacer(modifier = Modifier.height(8.dp))

                              Text(
                                  text = "إدارة درجات الطلاب والشعب والحسابات السنوية بسهولة."
                              )
                          }
                      }
                  }

                  item {
                      Text(
                          text = "الشعب",
                          fontSize = 20.sp,
                          fontWeight = FontWeight.Bold
                      )
                  }

                  items(sections) { section ->

                      Card(
                          modifier = Modifier.fillMaxWidth()
                      ) {
                          Row(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .padding(18.dp),
                              verticalAlignment = Alignment.CenterVertically
                          ) {

                              Column(
                                  modifier = Modifier.weight(1f)
                              ) {
                                  Text(
                                      text = section,
                                      fontSize = 18.sp,
                                      fontWeight = FontWeight.Bold
                                  )

                                  Text(
                                      text = "50 طالب"
                                  )
                              }

                              Button(
                                  onClick = {}
                              ) {
                                  Text("فتح")
                              }
                          }
                      }
                  }

                  item {
                      Spacer(modifier = Modifier.height(8.dp))

                      Button(
                          onClick = {},
                          modifier = Modifier.fillMaxWidth()
                      ) {
                          Text(
                              text = "إضافة طالب جديد",
                              fontSize = 17.sp
                          )
                      }
                  }
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GradeBook-APK
          path: app/build/outputs/apk/debug/app-debug.apk
