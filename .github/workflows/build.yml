name: Build GradeBook Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify source code
        run: |
          echo "========================================"
          echo "GRADEBOOK SOURCE VERIFICATION"
          echo "========================================"

          echo "Commit:"
          git rev-parse HEAD

          echo ""
          echo "MainActivity location:"
          ls -l app/src/main/java/com/ameer/gradebook/MainActivity.java

          echo ""
          echo "First lines:"
          head -n 10 app/src/main/java/com/ameer/gradebook/MainActivity.java

          echo ""
          echo "Checking old code..."

          if grep -q "سيتم تطويرها" app/src/main/java/com/ameer/gradebook/MainActivity.java; then
            echo "ERROR: OLD MainActivity.java FOUND!"
            echo "The old code is still in the repository."
            exit 1
          fi

          echo "SUCCESS: Old placeholder code was NOT found."

      - name: Build APK
        run: |
          gradle clean assembleDebug --no-daemon

      - name: Verify APK
        run: |
          echo "Checking APK..."
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gradebook-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
