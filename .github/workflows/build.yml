name: Build GradeBook Android

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create required directories
        run: |
          mkdir -p app/src/main/java/com/ameer/gradebook
          mkdir -p app/src/main/res/values

      - name: Verify MainActivity
        run: |
          echo "Checking MainActivity.java..."
          test -f app/src/main/java/com/ameer/gradebook/MainActivity.java
          echo "MainActivity.java exists."
          echo "Package:"
          head -n 5 app/src/main/java/com/ameer/gradebook/MainActivity.java

      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gradebook-apk
          path: app/build/outputs/apk/debug/app-debug.apk
